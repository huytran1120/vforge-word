[package]
name = "vforge-word-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "VForge Word rasteriser: pages and thumbnails from the layout display list (vello_cpu), PNG/JPEG export"

[lints]
workspace = true

[dependencies]
vforge-word-geom = { workspace = true, features = ["image"] }
vforge-word-doc = { workspace = true }
vforge-word-fonts = { workspace = true }
vforge-word-layout = { workspace = true }
vforge-word-metafile = { workspace = true }
vello_cpu = { workspace = true }
image = { workspace = true }
log = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vello_cpu = { workspace = true, features = ["multithreading"] }
